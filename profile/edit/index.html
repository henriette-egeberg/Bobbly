<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../../src/style.css" />
		<script src="" defer></script>

		<title>Register - Böbbly</title>
	</head>
	<body>
		<header>
			<img src="../../public/Bobbly_logo_transparent.svg" alt="böbbly" />
			<section>
				<span>explore</span>
				<span>Trending</span>
				<span>Collection</span>
			</section>
			<section><button>Create Post</button> <button>Pro</button></section>
		</header>
		<main id="app_edit" class="edit">
			<h1>Edit Profile</h1>
			<label for="name">Name:</label>
			<input type="text" id="name" placeholder="Current Name" />

			<label for="email">Bio:</label>
			<textarea class="bio" maxlength="500" rows="5" cols="50" placeholder="Current Bio"></textarea>

			<label for="password">Avatar URL:</label>
			<input type="password" id="password" placeholder="Current Avatar URL" />

			<label for="password">Avatar Alt Text:</label>
			<input type="password" id="password" placeholder="Current Avatar Alt Text" />

			<label for="password">Banner URL:</label>
			<input type="password" id="password" placeholder="Current Banner URL" />

			<label for="password">Banner Alt Text:</label>
			<input type="password" id="password" placeholder="Current Banner Alt Text" />

			<button id="regBtn" type="button">Update Profile</button>
			<p>Not Ready for Change? <a href="#" id="loginBtnLink">Profile</a></p>
		</main>
		<footer>
			<p>&copy; 2023 Böbbly. All rights reserved.</p>
		</footer>
	</body>
</html>
